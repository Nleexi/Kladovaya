<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Школьная кладовая</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f6fed;--bd:#dfe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf1;--mut:#9aa3b5;--ac:#6b9bff;--bd:#2d3441}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
input,button{font:inherit}
input[type=text],input[type=search],input[type=email],input[type=password]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button:disabled{opacity:.6}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.box label{display:block;margin:8px 0 4px;color:var(--mut);font-size:14px}
.card video{width:100%;border-radius:8px;background:#000;max-height:60vh}
.card h2{margin:10px 0 2px;font-size:18px}
.card p{margin:0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.mut{color:var(--mut);font-size:14px}
a{color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>🔦 Школьная кладовая</h1>
<input type="search" id="q" placeholder="Поиск: например, фонарик" autocomplete="off">

<div id="bar" class="mut" style="margin:8px 0"><a href="#" id="showlogin">Войти, чтобы добавлять видео</a></div>

<div id="login" class="box" hidden>
  <strong>Вход</strong>
  <label for="em">Логин (email)</label><input type="email" id="em" autocomplete="username">
  <label for="pw">Пароль</label><input type="password" id="pw" autocomplete="current-password">
  <div class="row"><button id="go">Войти</button></div>
  <div id="lmsg" class="mut" style="margin-top:6px"></div>
</div>

<div id="admin" class="box" hidden>
  <strong>Добавить предмет</strong>
  <label for="name">Название (например, фонарик)</label><input type="text" id="name">
  <label for="where">Где лежит (необязательно)</label><input type="text" id="where">
  <label for="file">Видео (до 50 МБ)</label><input type="file" id="file" accept="video/*">
  <div class="row"><button id="add">Сохранить</button><button class="sec" id="out">Выйти</button></div>
  <div id="msg" class="mut" style="margin-top:6px"></div>
</div>

<div id="list"></div>
<div id="empty" class="mut" hidden></div>
</main>

<script>
// ====== НАСТРОЙКИ: вставьте свои значения из Supabase (Project Settings -> API) ======
var SUPABASE_URL = 'https://ВАШ-ПРОЕКТ.supabase.co';
var SUPABASE_KEY = 'ВАШ-ANON-PUBLIC-KEY';
// =====================================================================================

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var items = [], authed = false;
var $ = function(id){return document.getElementById(id)};

function videoUrl(p){return sb.storage.from('videos').getPublicUrl(p).data.publicUrl}

function render(){
  var q = $('q').value.trim().toLowerCase();
  var list = $('list'); list.textContent = '';
  var shown = items.filter(function(i){return !q || i.name.toLowerCase().indexOf(q) > -1});
  shown.forEach(function(i){
    var c = document.createElement('div'); c.className = 'box card';
    var v = document.createElement('video'); v.controls = true; v.preload = 'metadata'; v.playsInline = true; v.src = videoUrl(i.path);
    var h = document.createElement('h2'); h.textContent = i.name;
    c.appendChild(v); c.appendChild(h);
    if (i.place) { var p = document.createElement('p'); p.textContent = '📍 ' + i.place; c.appendChild(p) }
    if (authed) {
      var r = document.createElement('div'); r.className = 'row';
      var b = document.createElement('button'); b.className = 'sec'; b.textContent = 'Удалить';
      b.onclick = function(){ if (confirm('Удалить «' + i.name + '»?')) remove(i) };
      r.appendChild(b); c.appendChild(r);
    }
    list.appendChild(c);
  });
  var e = $('empty');
  e.hidden = shown.length > 0;
  e.textContent = items.length === 0 ? 'Пока ничего не добавлено.' : 'Ничего не найдено.';
}

async function load(){
  var r = await sb.from('items').select('*').order('name');
  if (!r.error) { items = r.data; render() }
}

async function remove(i){
  await sb.storage.from('videos').remove([i.path]);
  var r = await sb.from('items').delete().eq('id', i.id);
  if (r.error) alert('Не удалось удалить'); else load();
}

async function add(){
  var name = $('name').value.trim(), f = $('file').files[0], msg = $('msg');
  if (!name) { msg.textContent = 'Введите название.'; return }
  if (!f) { msg.textContent = 'Выберите видео.'; return }
  if (f.size > 50*1024*1024) { msg.textContent = 'Видео больше 50 МБ.'; return }
  $('add').disabled = true; msg.textContent = 'Загружаю…';
  var ext = (f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '');
  var path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
  var up = await sb.storage.from('videos').upload(path, f, {contentType: f.type || 'video/mp4'});
  if (up.error) { msg.textContent = 'Ошибка загрузки: ' + up.error.message; $('add').disabled = false; return }
  var ins = await sb.from('items').insert({name: name, place: $('where').value.trim() || null, path: path});
  if (ins.error) { msg.textContent = 'Ошибка: ' + ins.error.message }
  else { $('name').value = ''; $('where').value = ''; $('file').value = ''; msg.textContent = 'Готово ✔'; load() }
  $('add').disabled = false;
}

function setAuth(on){
  authed = on;
  $('admin').hidden = !on; $('bar').hidden = on; $('login').hidden = true;
  render();
}

$('q').addEventListener('input', render);
$('add').addEventListener('click', add);
$('showlogin').addEventListener('click', function(e){ e.preventDefault(); $('login').hidden = false; $('em').focus() });
$('go').addEventListener('click', async function(){
  var r = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  if (r.error) $('lmsg').textContent = 'Неверный логин или пароль.';
  else { $('pw').value = ''; setAuth(true) }
});
$('out').addEventListener('click', async function(){ await sb.auth.signOut(); setAuth(false) });

sb.auth.getSession().then(function(r){ setAuth(!!r.data.session) });
load();
</script>
</body>
</html>
